<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DeskRemote Stream</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            touch-action: none;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: crosshair;
            background: #000;
            touch-action: none;
        }
        #statusOverlay {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 13px;
            border-radius: 6px;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.5s;
            border: 1px solid #333;
        }
        .connected { color: #4caf50 !important; border-color: #2e7d32 !important; }

        #topControls {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
            z-index: 20;
            opacity: 0.85;
            transition: opacity 0.3s;
        }
        #topControls:hover {
            opacity: 1;
        }
        .ctrl-btn {
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid #555;
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ctrl-btn:hover, .ctrl-btn:active {
            background: #1976d2;
            border-color: #1976d2;
        }

        .quick-keys-bar {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 25;
            background: rgba(20, 20, 20, 0.88);
            padding: 6px 10px;
            border-radius: 10px;
            backdrop-filter: blur(8px);
            border: 1px solid #444;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }
        .qk-btn {
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
        }
        .qk-btn:hover, .qk-btn:active {
            background: #1976d2;
            border-color: #1976d2;
        }

        #authModal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
        }
        .auth-card {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .auth-card h3 {
            margin: 0 0 16px 0;
            color: #fff;
            font-size: 18px;
        }
        .auth-card input {
            width: 100%;
            padding: 14px;
            background: #2b2b2b;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 20px;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 14px;
            outline: none;
            -webkit-appearance: none;
        }
        .auth-card input:focus {
            border-color: #1976d2;
        }
        .auth-card button {
            width: 100%;
            padding: 14px;
            background: #1976d2;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
        }
        .auth-card button:hover, .auth-card button:active {
            background: #1565c0;
        }
        #authError {
            color: #f44336;
            font-size: 13px;
            margin-top: 10px;
            min-height: 18px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="authModal">
        <form id="authForm" class="auth-card" onsubmit="return false;">
            <h3>Доступ к ПК</h3>
            <input type="password" id="pinInput" placeholder="Введите PIN" maxlength="16" inputmode="numeric" pattern="[0-9]*" autofocus autocomplete="current-password">
            <button type="submit" id="loginBtn">Войти</button>
            <div id="authError"></div>
        </form>
    </div>

    <div id="container">
        <div id="statusOverlay">Ожидание ввода PIN...</div>
        <div id="topControls">
            <button type="button" id="kbdBtn" class="ctrl-btn" title="Вызов экранной клавиатуры">⌨ Клавиатура</button>
            <button type="button" id="fsBtn" class="ctrl-btn" title="Развернуть / Свернуть">⛶ На весь экран</button>
        </div>

        <div id="quickKeys" class="quick-keys-bar" style="display:none;">
            <button type="button" class="qk-btn" data-key="Escape">Esc</button>
            <button type="button" class="qk-btn" data-key="Tab">Tab</button>
            <button type="button" class="qk-btn" data-key="Meta">Win</button>
            <button type="button" class="qk-btn" data-key="Backspace">⌫ Back</button>
            <button type="button" class="qk-btn" data-key="Enter">⏎ Enter</button>
        </div>

        <input type="text" id="mobileInput" style="position:fixed; opacity:0; left:0; top:-100px; width:1px; height:1px; pointer-events:none; z-index:-1;" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">

        <video id="remoteVideo" autoplay playsinline webkit-playsinline x5-playsinline muted></video>
    </div>

    <script>
        const video = document.getElementById('remoteVideo');
        const statusOverlay = document.getElementById('statusOverlay');
        const authModal = document.getElementById('authModal');
        const authForm = document.getElementById('authForm');
        const pinInput = document.getElementById('pinInput');
        const loginBtn = document.getElementById('loginBtn');
        const authError = document.getElementById('authError');
        const fsBtn = document.getElementById('fsBtn');
        const kbdBtn = document.getElementById('kbdBtn');
        const quickKeys = document.getElementById('quickKeys');
        const mobileInput = document.getElementById('mobileInput');
        let pc, inputChannel, ws;

        const iceConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun.cloudflare.com:3478' }
            ]
        };

        function safeStorageSet(key, val) {
            try { localStorage.setItem(key, val); } catch (e) {}
        }
        function safeStorageGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function safeStorageRemove(key) {
            try { localStorage.removeItem(key); } catch (e) {}
        }

        function toggleFullScreen() {
            try {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    } else if (document.documentElement.webkitRequestFullscreen) {
                        document.documentElement.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen().catch(() => {});
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                }
            } catch (e) {}
        }

        fsBtn.addEventListener('click', toggleFullScreen);
        document.addEventListener('fullscreenchange', () => {
            fsBtn.textContent = document.fullscreenElement ? "🗗 Оконный режим" : "⛶ На весь экран";
        });
        document.addEventListener('webkitfullscreenchange', () => {
            fsBtn.textContent = document.webkitFullscreenElement ? "🗗 Оконный режим" : "⛶ На весь экран";
        });

        // Переключение экранной клавиатуры на телефонах / планшетах
        let isKeyboardOpen = false;
        kbdBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isKeyboardOpen = !isKeyboardOpen;
            quickKeys.style.display = isKeyboardOpen ? 'flex' : 'none';
            kbdBtn.style.background = isKeyboardOpen ? '#1976d2' : '';
            if (isKeyboardOpen) {
                mobileInput.focus();
            } else {
                mobileInput.blur();
            }
        });

        // Быстрые клавиши (Esc, Tab, Win, Backspace, Enter)
        document.querySelectorAll('.qk-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const key = btn.getAttribute('data-key');
                sendInput({ t: "kd", key: key, code: key });
                sendInput({ t: "ku", key: key, code: key });
                if (isKeyboardOpen) {
                    mobileInput.focus();
                }
            });
        });

        // Обработка ввода текста на мобильных устройствах
        mobileInput.addEventListener('beforeinput', (e) => {
            if (e.inputType === 'deleteContentBackward') {
                sendInput({ t: "kd", key: "Backspace", code: "Backspace" });
                sendInput({ t: "ku", key: "Backspace", code: "Backspace" });
            } else if (e.inputType === 'insertLineBreak') {
                sendInput({ t: "kd", key: "Enter", code: "Enter" });
                sendInput({ t: "ku", key: "Enter", code: "Enter" });
            } else if (e.data) {
                sendInput({ t: "char", str: e.data });
            }
        });

        mobileInput.addEventListener('input', () => {
            mobileInput.value = "";
        });

        mobileInput.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' || e.key === 'Enter') {
                sendInput({ t: "kd", key: e.key, code: e.code });
                sendInput({ t: "ku", key: e.key, code: e.code });
            }
        });

        // Обработка клавиатуры на ПК (физическая клавиатура)
        const specialKeys = [
            "Backspace", "Tab", "Enter", "Shift", "Control", "Alt", "Pause",
            "CapsLock", "Escape", "PageUp", "PageDown", "End", "Home",
            "ArrowLeft", "ArrowUp", "ArrowRight", "ArrowDown", "PrintScreen",
            "Insert", "Delete", "Meta", "F1", "F2", "F3", "F4", "F5", "F6",
            "F7", "F8", "F9", "F10", "F11", "F12"
        ];

        window.addEventListener('keydown', (e) => {
            if (authModal.style.display !== 'none') return;
            if (e.target === pinInput) return;
            if (document.activeElement === mobileInput) return;

            if (specialKeys.includes(e.key)) {
                e.preventDefault();
                sendInput({ t: "kd", key: e.key, code: e.code });
                return;
            }

            if (e.ctrlKey || e.altKey || e.metaKey) {
                e.preventDefault();
                sendInput({ t: "kd", key: e.key, code: e.code });
                return;
            }

            if (e.key.length === 1) {
                e.preventDefault();
                sendInput({ t: "char", str: e.key });
            }
        });

        window.addEventListener('keyup', (e) => {
            if (authModal.style.display !== 'none') return;
            if (e.target === pinInput) return;
            if (document.activeElement === mobileInput) return;

            sendInput({ t: "ku", key: e.key, code: e.code });
        });

        function setStatus(text, isConnected = false) {
            statusOverlay.textContent = text;
            statusOverlay.style.opacity = '1';
            if (isConnected) {
                statusOverlay.classList.add("connected");
                setTimeout(() => statusOverlay.style.opacity = '0', 3500);
            } else {
                statusOverlay.classList.remove("connected");
            }
        }

        function initConnection(pin) {
            authError.textContent = "";
            loginBtn.textContent = "⏳ Вход...";
            loginBtn.disabled = true;
            setStatus("Авторизация на сервере...");

            try {
                if (ws) {
                    ws.close();
                    ws = null;
                }
                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//${location.host}/ws?pin=${encodeURIComponent(pin)}`);

                ws.onopen = () => {
                    safeStorageSet('deskremote_pin', pin);
                    authModal.style.display = 'none';
                    loginBtn.textContent = "Войти";
                    loginBtn.disabled = false;
                    setStatus("Установка WebRTC соединения...");
                    setupWebRTC();
                };

                ws.onerror = (err) => {
                    loginBtn.textContent = "Войти";
                    loginBtn.disabled = false;
                    authModal.style.display = 'flex';
                    authError.textContent = "Неверный PIN-код или сервер недоступен";
                    setStatus("Ошибка авторизации");
                    safeStorageRemove('deskremote_pin');
                    if (pc) pc.close();
                };

                ws.onclose = (ev) => {
                    loginBtn.textContent = "Войти";
                    loginBtn.disabled = false;
                    if (authModal.style.display === 'none') {
                        setStatus("Соединение с сервером закрыто");
                    }
                };
            } catch (err) {
                loginBtn.textContent = "Войти";
                loginBtn.disabled = false;
                authError.textContent = "Ошибка: " + err.message;
            }
        }

        function handleLogin() {
            const pin = pinInput.value.trim();
            if (pin) {
                toggleFullScreen();
                initConnection(pin);
            } else {
                authError.textContent = "Введите PIN-код";
            }
        }

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            handleLogin();
        });

        loginBtn.addEventListener('click', (e) => {
            e.preventDefault();
            handleLogin();
        });

        const savedPin = safeStorageGet('deskremote_pin');
        if (savedPin) {
            initConnection(savedPin);
        }

        async function setupWebRTC() {
            try {
                if (pc) pc.close();
                pc = new RTCPeerConnection(iceConfig);

                pc.ontrack = (event) => {
                    if (event.streams && event.streams[0]) {
                        video.srcObject = event.streams[0];
                    } else {
                        video.srcObject = new MediaStream([event.track]);
                    }
                    video.muted = true;
                    video.play().then(() => {
                        setStatus("Трансляция активна", true);
                    }).catch(() => {
                        setStatus("Трансляция готова (коснитесь экрана)");
                    });
                };

                pc.onconnectionstatechange = () => {
                    if (pc.connectionState === 'connected') {
                        setStatus("Соединено! Ожидание видеопотока...");
                    } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                        setStatus("Соединение разорвано. Переподключение...");
                    }
                };

                inputChannel = pc.createDataChannel("input", { ordered: false, maxRetransmits: 0 });
                inputChannel.onopen = () => bindInputEvents();

                pc.onicecandidate = (e) => {
                    if (e.candidate && ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: "candidate", candidate: e.candidate.toJSON() }));
                    }
                };

                pc.addTransceiver('video', { direction: 'recvonly' });
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: "offer", sdp: offer.sdp }));
                }

                ws.onmessage = async (e) => {
                    try {
                        const msg = JSON.parse(e.data);
                        if (msg.type === "answer") {
                            await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: msg.sdp }));
                        } else if (msg.type === "candidate" && msg.candidate) {
                            await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                        }
                    } catch (err) {}
                };
            } catch (err) {
                setStatus("Ошибка WebRTC: " + err.message);
            }
        }

        function sendInput(data) {
            if (inputChannel && inputChannel.readyState === "open") {
                inputChannel.send(JSON.stringify(data));
            }
        }

        function getNormalizedCoords(e) {
            const rect = video.getBoundingClientRect();
            const videoRatio = (video.videoWidth || 16) / (video.videoHeight || 9);
            const elementRatio = rect.width / rect.height;
            let renderW = rect.width, renderH = rect.height, offsetX = 0, offsetY = 0;

            if (elementRatio > videoRatio) {
                renderW = rect.height * videoRatio;
                offsetX = (rect.width - renderW) / 2;
            } else {
                renderH = rect.width / videoRatio;
                offsetY = (rect.height - renderH) / 2;
            }

            const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

            const clickX = clientX - rect.left - offsetX;
            const clickY = clientY - rect.top - offsetY;

            return {
                x: Math.max(0, Math.min(1, clickX / renderW)),
                y: Math.max(0, Math.min(1, clickY / renderH))
            };
        }

        function bindInputEvents() {
            let ticking = false;

            // Мышь (ПК)
            video.addEventListener('mousemove', (e) => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        const coords = getNormalizedCoords(e);
                        sendInput({ t: "mm", x: coords.x, y: coords.y });
                        ticking = false;
                    });
                    ticking = true;
                }
            });

            video.addEventListener('mousedown', (e) => {
                video.play().catch(() => {});
                sendInput({ t: "md", b: e.button });
            });
            video.addEventListener('mouseup', (e) => sendInput({ t: "mu", b: e.button }));
            video.addEventListener('contextmenu', (e) => e.preventDefault());
            video.addEventListener('wheel', (e) => {
                e.preventDefault();
                sendInput({ t: "mw", dy: e.deltaY < 0 ? 1 : -1 });
            }, { passive: false });

            // Сенсорное управление (Телефон / Планшет)
            video.addEventListener('touchstart', (e) => {
                video.play().catch(() => {});
                if (e.touches.length === 1) {
                    const coords = getNormalizedCoords(e);
                    sendInput({ t: "mm", x: coords.x, y: coords.y });
                    sendInput({ t: "md", b: 0 });
                }
            }, { passive: false });

            video.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) {
                    e.preventDefault();
                    if (!ticking) {
                        window.requestAnimationFrame(() => {
                            const coords = getNormalizedCoords(e);
                            sendInput({ t: "mm", x: coords.x, y: coords.y });
                            ticking = false;
                        });
                        ticking = true;
                    }
                }
            }, { passive: false });

            video.addEventListener('touchend', (e) => {
                sendInput({ t: "mu", b: 0 });
            }, { passive: false });
        }
    </script>
</body>
</html>
